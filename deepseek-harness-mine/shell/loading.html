<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; img-src 'self'" />
  <title>天工</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1e1e1e; color: #d4d4d4;
      font: 14px/1.7 "Segoe UI", "Microsoft YaHei", sans-serif;
      display: flex; align-items: center; justify-content: center; min-height: 100vh;
    }
    .card { max-width: 480px; padding: 40px; text-align: center; }
    .logo {
      width: 76px; height: 76px; margin: 0 auto 22px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    .logo img { width: 100%; height: 100%; display: block; user-select: none; -webkit-user-drag: none; }
    @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    h1 { font-size: 19px; color: #fff; margin-bottom: 8px; }
    p { color: #9d9d9d; font-size: 13px; }
    .steps { margin-top: 16px; font-size: 12px; color: #6f6f6f; min-height: 20px; }
    .bar {
      width: 220px; height: 4px; margin: 18px auto 0; border-radius: 2px;
      background: #333; overflow: hidden;
    }
    /* 进度条两种模式：默认 = 不确定（来回滑，用于"启动/检查中"）；
       加 .indet 之外的普通态 = 确定进度（宽度由主进程按下载进度写入，见 main.js splashSet） */
    .bar > i {
      display: block; width: 0; height: 100%; border-radius: 2px;
      background: #0e639c; transition: width .2s ease-out;
    }
    .bar.indet > i { width: 40%; animation: slide 1.2s ease-in-out infinite; transition: none; }
    @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo"><img src="assets/logo.png" alt="天工" /></div>
    <h1 id="st-title">天工 正在启动…</h1>
    <p id="st-sub">正在检查更新并准备 IDE 工作台</p>
    <div class="bar indet" id="st-bar"><i id="st-fill"></i></div>
    <div class="steps" id="st-steps">正在准备…</div>
  </div>
</body>
</html>
